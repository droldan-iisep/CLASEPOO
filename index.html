<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armonía | Instrumentos Musicales</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <nav class="navbar">
      <a href="#" class="logo">🎵 Armonía</a>
      <ul class="nav-links">
        <li><a href="#productos">Catálogo</a></li>
        <li><a href="#ventas">Ventas</a></li>
        <li><a href="#delivery">Delivery</a></li>
      </ul>
    </nav>
  </header>

  <!-- SECCIÓN 1: LISTADO (Alumno 1) -->
  <section class="seccion" id="productos">
    <h2 class="section-title">Catálogo de Instrumentos</h2>
    <div class="grid-productos" id="gridProductos"></div>
  </section>

  <!-- SECCIÓN 2: VENTAS (Alumno 2) -->
  <section class="seccion" id="ventas">
    <h2 class="section-title">Registrar Venta</h2>
    <div class="panel">
      <label>Producto: <select id="ventaProducto"></select></label>
      <label>Cantidad: <input type="number" id="ventaCantidad" value="1" min="1"></label>
      <button class="btn-primary" id="btnRegistrarVenta">Registrar</button>
    </div>
    <table class="tabla" id="tablaVentas">
      <thead>
        <tr><th>#</th><th>Producto</th><th>Cant.</th><th>Total</th><th>Fecha</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- SECCIÓN 3: DELIVERY (Alumno 3) -->
  <section class="seccion" id="delivery">
    <h2 class="section-title">Gestión de Delivery</h2>
    <div class="panel">
      <label>Cliente: <input type="text" id="deliveryCliente"></label>
      <label>Dirección: <input type="text" id="deliveryDireccion"></label>
      <label>Venta: <select id="deliveryVenta"><option value="">-- Seleccionar --</option></select></label>
      <button class="btn-primary" id="btnCrearDelivery">Crear envío</button>
    </div>
    <ul class="lista-delivery" id="listaDelivery"></ul>
  </section>

  <footer class="footer"><p>&copy; 2025 Armonía</p></footer>

  <!-- CARGA DE SCRIPTS -->
  <script src="js/listado.js"></script>
  <script src="js/ventas.js"></script>
  <script src="js/delivery.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
